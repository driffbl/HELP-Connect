<app-header></app-header>

<div class="page-container" style="max-width: 720px;">
  <h1>Welcome, {{ userName }}!</h1>
  <p style="text-align: center; color: #666; margin-bottom: 32px;">
    {{ userEmail }}
  </p>

  <div class="success">You are signed in.</div>

  <div class="dashboard-grid">
    
    <!-- Volunteer Card (Dynamic) -->
    <a [routerLink]="isVolunteer() ? '/volunteer/profile' : '/volunteer/register'" class="dash-card">
      <div class="dash-icon">🤝</div>
      <h3>{{ isVolunteer() ? 'View Volunteer Profile' : 'Become a Volunteer' }}</h3>
      <p>{{ isVolunteer() ? 'See your volunteer info' : 'Share your skills with students' }}</p>
    </a>

    <!-- NEW: Student Profile Card -->
    <a routerLink="/student/profile" class="dash-card">
      <div class="dash-icon">👤</div>
      <h3>My Student Profile</h3>
      <p>Update your personal info</p>
    </a>

    <!-- Home Card -->
    <a routerLink="/" class="dash-card">
      <div class="dash-icon">🏠</div>
      <h3>Home</h3>
      <p>Back to the main page</p>
    </a>

  </div>
</div>
