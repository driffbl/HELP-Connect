<div class="page-container">
  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="brand-title">HELP Connect</div>
    <div class="header-right">
      <button type="button" class="icon-btn">
        <svg viewBox="0 0 24 24" class="header-icon"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
      </button>
      <button type="button" class="icon-btn">
        <svg viewBox="0 0 24 24" class="header-icon"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
      </button>
    </div>
  </header>

  <main class="main-content">
    <div class="dashboard-card">

      <!-- Card Header -->
      <div class="card-header">
        <button type="button" class="btn-back" (click)="onGoBack()">
          <span class="arrow">&larr;</span> Go Back
        </button>
        <h1 class="page-title">Incoming Requests</h1>
      </div>

      <!-- Empty State -->
      <div *ngIf="pendingRequests.length === 0" class="empty-state">
        <p>You have no pending requests at this time.</p>
      </div>

      <!-- Requests List -->
      <div class="requests-list" *ngIf="pendingRequests.length > 0">
        <article *ngFor="let req of pendingRequests" class="request-card">

          <!-- Top Strip: ID & Category -->
          <div class="card-top-strip">
            <span class="request-id">{{ req.request_id }}</span>
            <span class="request-category">{{ req.category }}</span>
          </div>

          <!-- Body: Request Details -->
          <div class="card-body">
            <div class="details-row">
              <h2 class="request-title">{{ req.title }}</h2>
              <span class="status-badge pending">Pending</span>
            </div>

            <div class="meta-grid">
              <p class="meta-data"><strong>Student:</strong> {{ req.student_name }}</p>
              <p class="meta-data"><strong>Date:</strong> {{ req.date }}</p>
              <p class="meta-data"><strong>Time:</strong> {{ req.time }}</p>
              <p class="meta-data"><strong>Mode:</strong> {{ req.support_mode }}</p>
              <p class="meta-data"><strong>Description:</strong> {{ req.description }}</p>
            </div>
          </div>

          <!-- Footer Actions: Reject / Accept -->
          <div class="card-actions">
            <button class="btn-reject" (click)="onRejectRequest(req)">[ Reject ]</button>
            <button class="btn-accept" (click)="onAcceptRequest(req)">[ Accept Request ]</button>
          </div>

        </article>
      </div>

    </div>
  </main>
</div>
