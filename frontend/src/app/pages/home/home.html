<app-header></app-header>

<!-- Before login -->
<div class="hero" *ngIf="!user">
  <div class="hero-left">
    <h1>Need a hand?</h1>
    <p class="hero-text">
      HELP Connect is a peer-to-peer support platform made by HELP students,
      for HELP students.
    </p>
    <button class="btn-outline" routerLink="/signup" style="margin-bottom: 12px;">
      → Register to get started
    </button>
    <button class="btn-outline" routerLink="/login">
      → Already have an account? Sign In
    </button>
  </div>
  <div class="hero-right">
    <img src="campus.jpg" alt="Campus" class="hero-image" />
  </div>
</div>

<!-- After login -->
<div class="hero-logged-in" *ngIf="user">
  <h1>Need a hand?</h1>
  <p class="hero-text">
    HELP Connect is a peer-to-peer support platform made by HELP students,
    for HELP students.
  </p>

  <div class="action-list">
    <!-- LINKED TO WEI YANG'S PAGE -->
    <button type="button" class="btn-primary" routerLink="/request-support" style="margin-bottom: 12px;">
      I would like to request support
    </button>

    <!-- LINKED TO ZU YUAN'S MY SESSIONS PAGE (requests now show up there as Pending sessions) -->
    <button type="button" class="btn-primary" routerLink="/sessions" style="margin-bottom: 12px;">
      I would like to check on My Sessions
    </button>

    <!-- YOUR VOLUNTEER BUTTON -->
    <button type="button" class="btn-primary" (click)="onVolunteerClick()" style="margin-bottom: 12px;">
      {{ isVolunteer() ? 'View My Volunteer Profile' : 'I would like to become a volunteer' }}
    </button>
  </div>

  <div class="quick-links">

    <a routerLink="/dashboard" class="quick-card">
      <div class="quick-icon">👤</div>
      <div class="quick-label">Profile</div>
    </a>

    <button type="button" class="quick-card" routerLink="/past-sessions">
      <div class="quick-icon">⏱</div>
      <div class="quick-label">Past Sessions</div>
    </button>
  </div>
</div>
