<app-header></app-header>

<div class="page-container">
  <h1>Reset Password</h1>
  <p style="text-align: center; color: #666; margin-bottom: 24px;">
    An OTP has been sent to <strong>{{ email }}</strong>
  </p>

  <div class="error" *ngIf="error()">{{ error() }}</div>
  <div class="success" *ngIf="success()">✓ {{ success() }}</div>

  <form (ngSubmit)="onSubmit()">
    <label>6-digit OTP</label>
    <input
      type="text"
      name="code"
      [(ngModel)]="code"
      placeholder="Enter 6-digit OTP"
      maxlength="6"
      required
    />

    <!-- UPDATED: New Password with Show/Hide -->
    <label>New Password</label>
    <div style="position: relative; margin-bottom: 16px;">
      <input
        [type]="showPassword ? 'text' : 'password'"
        name="newPassword"
        [(ngModel)]="newPassword"
        placeholder="At least 8 characters"
        style="margin-bottom: 0; padding-right: 40px;"
        required
      />
      <button
        type="button"
        (click)="showPassword = !showPassword"
        style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; width: auto; color: #e63946; font-size: 12px; font-weight: 600; padding: 0;"
      >
        {{ showPassword ? 'Hide' : 'Show' }}
      </button>
    </div>

    <button type="submit" class="btn-primary" [disabled]="loading()">
      {{ loading() ? 'Resetting...' : 'Reset Password' }}
    </button>
  </form>

  <div class="link">
    Didn't receive a code? 
    <a (click)="resendCode()" style="cursor: pointer; color: #e63946; font-weight: 600; text-decoration: underline;">
      Resend Code
    </a>
  </div>
</div>
