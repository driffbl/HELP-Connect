<div class="topbar">
  <div class="brand">
    <a routerLink="/">HELP Connect</a>
  </div>

  <div class="nav-links">
    <a routerLink="/" *ngIf="!isLoggedIn">Home</a>
    <a routerLink="/login" *ngIf="!isLoggedIn">Sign In</a>
    <a routerLink="/signup" *ngIf="!isLoggedIn">Register</a>

    <a routerLink="/dashboard" *ngIf="isLoggedIn">Dashboard</a>
    <a routerLink="/sessions" *ngIf="isLoggedIn">My Sessions</a>
    <a routerLink="/past-sessions" *ngIf="isLoggedIn">Past Sessions</a>
    <a routerLink="/volunteer/register" *ngIf="isLoggedIn">Volunteer</a>

    <!-- Notification Bell & System Feed Dropdown -->
    <div class="notification-wrapper" *ngIf="isLoggedIn" (click)="$event.stopPropagation()">
      <button
        type="button"
        class="bell-btn"
        (click)="toggleDropdown($event)"
        aria-label="Notifications"
        title="Notifications">
        <svg viewBox="0 0 24 24" class="bell-icon">
          <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
        </svg>
        <span class="notification-badge" *ngIf="unreadCount > 0">
          {{ unreadCount > 9 ? '9+' : unreadCount }}
        </span>
      </button>

      <div class="notification-dropdown" *ngIf="showDropdown">
        <div class="dropdown-header">
          <span class="dropdown-title">Notifications ({{ unreadCount }} unread)</span>
          <button
            type="button"
            class="btn-mark-all"
            (click)="onMarkAllRead($event)"
            *ngIf="unreadCount > 0">
            Mark all read
          </button>
        </div>

        <div class="dropdown-body">
          <div *ngIf="notifications.length === 0" class="empty-notifications">
            No notifications yet.
          </div>

          <div
            *ngFor="let item of notifications"
            class="notification-item"
            [class.unread]="(item.status || item.Notification_status) === 'Unread'"
            (click)="onNotificationClick(item, $event)">
            <p class="notification-msg">{{ item.message || item.Message }}</p>
            <span class="notification-time">{{ (item.createdAt || item.created_at || item.Created_at) | date:'short' }}</span>
          </div>
        </div>
      </div>
    </div>

    <a routerLink="/" *ngIf="isLoggedIn" (click)="logout()" class="logout-btn">
      Logout
    </a>
  </div>
</div>
